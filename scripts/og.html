<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0e1319; color: #e3e8ee; font-family: "IBM Plex Sans", sans-serif; position: relative; }
  .wrap { position: absolute; inset: 0; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: .12em; color: #8c99a9; }
  h1 { font-family: "IBM Plex Sans Condensed", sans-serif; font-weight: 700; font-size: 76px; line-height: 1.02; margin: 18px 0 0; letter-spacing: -.01em; }
  .sub { font-size: 27px; color: #b7c2cf; margin-top: 18px; max-width: 900px; line-height: 1.35; }
  .map { position: absolute; right: 56px; bottom: 44px; }
  .site { position: absolute; left: 64px; bottom: 50px; font-family: "IBM Plex Mono", monospace; font-size: 26px; font-weight: 600; color: #f29a3a; }
  .accent { color: #f29a3a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">LINUX 7.3 · 5.10 &nbsp;·&nbsp; TCP / UDP / MULTICAST</div>
  <h1>A Packet’s Path<br>Through the <span class="accent">Linux Kernel</span></h1>
  <div class="sub">From <code style="font-family:'IBM Plex Mono'">write()</code> to the wire and back, step by step.</div>
</div>

<!-- The send path as on the site's path map: x = step, y = stack layer -->
<svg class="map" width="560" height="250" viewBox="0 0 560 250" font-family="IBM Plex Mono, monospace">
  <g stroke="#26313e" stroke-width="1">
    <line x1="70" x2="560" y1="20" y2="20"/><line x1="70" x2="560" y1="55" y2="55"/><line x1="70" x2="560" y1="90" y2="90"/>
    <line x1="70" x2="560" y1="125" y2="125"/><line x1="70" x2="560" y1="160" y2="160"/><line x1="70" x2="560" y1="195" y2="195"/><line x1="70" x2="560" y1="230" y2="230"/>
  </g>
  <g stroke="#8c99a9" stroke-dasharray="4 5" opacity=".5"><line x1="0" x2="560" y1="37" y2="37"/><line x1="0" x2="560" y1="177" y2="177"/></g>
  <g fill="#8c99a9" font-size="15" text-anchor="end">
    <text x="58" y="25">App</text><text x="58" y="60">Socket</text><text x="58" y="95">TCP</text><text x="58" y="130">IP</text>
    <text x="58" y="165">Device</text><text x="58" y="200">NIC</text><text x="58" y="235">Wire</text>
  </g>
  <polyline fill="none" stroke="#f29a3a" stroke-width="4" stroke-linejoin="round"
    points="90,20 125,55 160,90 195,90 230,90 265,125 300,125 335,125 370,125 405,160 440,160 475,160 510,195 545,230"/>

    <circle cx="230" cy="90" r="7"/><circle cx="265" cy="125" r="7"/><circle cx="370" cy="125" r="7"/><circle cx="405" cy="160" r="7"/>
    <circle cx="440" cy="160" r="7"/><circle cx="475" cy="160" r="7"/><circle cx="510" cy="195" r="7"/>
  </g>
  <g fill="#f06a8f"><path d="M300 115L310 125L300 135L290 125Z"/><path d="M335 115L345 125L335 135L325 125Z"/></g>
  <g fill="#f06a8f" font-size="13" font-weight="600" text-anchor="middle"><text x="300" y="107">OUT</text><text x="335" y="107">POST</text></g>
  <circle cx="545" cy="230" r="15" fill="#f29a3a" opacity=".25"/><circle cx="545" cy="230" r="8" fill="#f29a3a"/>
</svg>
<div class="site">packetpath.fyi</div>
