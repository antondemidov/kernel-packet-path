name: Verify against kernel sources

# Checks that every kernel function and constant named in the step texts exists in Linux 5.10.8
# (base texts) and 7.3 ("Linux 7.x" notes). See scripts/kernel-refs.test.ts.
on:
  push:
    branches: [main]
    paths: [src/steps.ts, scripts/kernel-refs.test.ts, .github/workflows/verify-kernel.yml]
  pull_request:
    paths: [src/steps.ts, scripts/kernel-refs.test.ts, .github/workflows/verify-kernel.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch kernel sources (net/, include/, security/ only)
        run: |
          fetch() {
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch "$2" "$1" "$3"
            git -C "$3" sparse-checkout set net include security
          }
          fetch https://github.com/gregkh/linux v5.10.8 "$RUNNER_TEMP/linux-5.10" &
          fetch https://github.com/torvalds/linux v7.3 "$RUNNER_TEMP/linux-7.3" &
          wait
      - run: npx vitest run scripts/kernel-refs.test.ts
        env:
          KERNEL_5_10: ${{ runner.temp }}/linux-5.10
          KERNEL_7_3: ${{ runner.temp }}/linux-7.3
