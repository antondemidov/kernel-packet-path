name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch kernel sources for the accuracy check (net/, include/, security/, drivers/net/veth.c)
        run: |
          fetch() {
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch "$2" "$1" "$3"
            git -C "$3" sparse-checkout set --no-cone /net/ /include/ /security/ /drivers/net/veth.c
          }
          fetch https://github.com/gregkh/linux v5.10.8 "$RUNNER_TEMP/linux-5.10" &
          fetch https://github.com/torvalds/linux v7.3 "$RUNNER_TEMP/linux-7.3" &
          wait
      # Data integrity tests plus the check that every kernel name in the texts exists in 5.10.8 / 7.3;
      # nothing is deployed if either fails
      - run: npm test
        env:
          KERNEL_5_10: ${{ runner.temp }}/linux-5.10
          KERNEL_7_3: ${{ runner.temp }}/linux-7.3
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
